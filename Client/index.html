<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParcelDrop</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("parceldrop_theme");
          if (!saved) {
            var raw = localStorage.getItem("user");
            if (raw) {
              var user = JSON.parse(raw);
              saved = user && user.theme_preference;
            }
          }
          var valid = ["ocean-blue", "forest-mint", "mahogany-taupe", "midnight-purple", "forest-olive", "midnight-teal"];
          if (saved && valid.indexOf(saved) !== -1) {
            document.documentElement.setAttribute("data-theme", saved);
          } else {
            document.documentElement.setAttribute("data-theme", "ocean-blue");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "ocean-blue");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
