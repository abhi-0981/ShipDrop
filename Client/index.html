<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title & SEO Basics -->
    <title>ParcelDrop | Smart eCommerce Shipping & Logistics Platform in India</title>
    <meta
      name="description"
      content="ParcelDrop provides automated multi-courier shipping, live Delhivery tracking, seamless NDR management, and affordable rates for Indian eCommerce businesses."
    />
    <meta
      name="keywords"
      content="parceldrop, courier aggregation, ecommerce shipping, delhivery live tracking, ndr management, shipping calculator, cheap courier rates india"
    />
    <meta name="author" content="ParcelDrop" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#008dd2" />
    <link rel="canonical" href="https://parceldrop.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://parceldrop.in/" />
    <meta property="og:title" content="ParcelDrop | Smart eCommerce Shipping & Logistics Platform" />
    <meta
      property="og:description"
      content="Automated multi-courier shipping, live parcel tracking, and lowest shipping rates across India."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="ParcelDrop" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ParcelDrop | eCommerce Shipping & Logistics" />
    <meta
      name="twitter:description"
      content="Automated multi-courier shipping, live parcel tracking, and lowest shipping rates across India."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Font Preconnect & Loading Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ParcelDrop",
        "url": "https://parceldrop.in",
        "logo": "https://parceldrop.in/favicon.svg",
        "description": "Leading eCommerce logistics and parcel shipping enabler for India's online businesses."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
